name: Wynfall engine build

# Builds the Wynfall Image Engine (stable-diffusion.cpp plus the request guard patch) for Windows and publishes the
# zips as release assets. The guard test runs against the real code before anything is packed.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish, for example wynfall-master-948-228c707-r1. Empty builds without publishing."
        required: false
        type: string

permissions:
  contents: write

env:
  UPSTREAM: master-948-228c707

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: cpu
            defines: "-DGGML_NATIVE=OFF -DSD_BUILD_SHARED_LIBS=ON -DSD_BUILD_SHARED_GGML_LIB=ON -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON"
          - build: cuda12
            defines: "-DSD_CUDA=ON -DSD_BUILD_SHARED_LIBS=ON -DCMAKE_CUDA_ARCHITECTURES='75;86;89;120' -DCMAKE_CUDA_FLAGS='-Xcudafe \"--diag_suppress=177\" -Xcudafe \"--diag_suppress=550\"' -DGGML_NATIVE=OFF -DSD_BUILD_SHARED_GGML_LIB=ON -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CUDA toolkit
        if: ${{ matrix.build == 'cuda12' }}
        id: cuda-toolkit
        uses: Jimver/cuda-toolkit@v0.2.22
        with:
          cuda: "12.8.1"
          method: "network"
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_CXX_FLAGS='/bigobj' -G Ninja -DCMAKE_C_COMPILER=cl.exe -DCMAKE_CXX_COMPILER=cl.exe -DCMAKE_BUILD_TYPE=Release -DSD_SERVER_BUILD_FRONTEND=OFF ${{ matrix.defines }}
          cmake --build .

      - name: Guard test (real code over real HTTP)
        run: |
          $t = Get-ChildItem build -Recurse -Filter wynfall-guard-test.exe | Select-Object -First 1
          if (-not $t) { throw "wynfall-guard-test.exe was not built" }
          & $t.FullName
          if ($LASTEXITCODE -ne 0) { throw "guard test failed" }

      - name: Pack
        run: |
          $src = if (Test-Path ".\build\bin\Release\sd-server.exe") { ".\build\bin\Release" } else { ".\build\bin" }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "$src\*" dist -Recurse -Exclude wynfall-guard-test.exe, sd-cli.exe, *.pdb, *.lib, *.exp
          Copy-Item ggml/LICENSE dist\ggml.txt
          Copy-Item LICENSE dist\stable-diffusion.cpp.txt
          Set-Content dist\WYNFALL-ENGINE.txt "Wynfall Image Engine. stable-diffusion.cpp $env:UPSTREAM plus the request guard patch (examples/server/wynfall_guard.h). Source: this repository at $env:GITHUB_SHA."
          if (-not (Test-Path dist\sd-server.exe)) { Get-ChildItem dist; throw "sd-server.exe is missing" }
          7z a wynfall-sd-${{ env.UPSTREAM }}-win-${{ matrix.build }}-x64.zip .\dist\*

      - uses: actions/upload-artifact@v4
        with:
          name: win-${{ matrix.build }}
          path: wynfall-sd-*.zip
          if-no-files-found: error

  release:
    needs: windows
    if: ${{ inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          ls -l assets
          gh release create "$TAG" assets/*.zip --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "stable-diffusion.cpp ${UPSTREAM} with the Wynfall request guard. Commit ${GITHUB_SHA}."
          sha256sum assets/*.zip
